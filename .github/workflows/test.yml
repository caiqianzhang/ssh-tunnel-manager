name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # go vet must compile Gio's Linux backend, which resolves X11 /
      # Wayland / xkb libraries through pkg-config — the stock Ubuntu
      # runner has none of those dev headers (same step as release.yml).
      - name: Install graphics dev headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxfixes-dev libwayland-dev libvulkan-dev \
            libegl1-mesa-dev libgles2-mesa-dev

      - name: Go vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...

      # Input-pipeline smoke test: clicks the real binary under Xvfb.
      # Catches "renders but never delivers clicks" bugs (missing
      # widget.Layout hit area) that unit tests and vet cannot see.
      - name: Install smoke test tools
        run: sudo apt-get install -y -qq xvfb xdotool x11-utils

      - name: Smoke test
        run: make smoke