name: release

# Building releases is expensive and only meaningful for a published
# version, so it is gated on a tag push (v1.2.3, v1.2.3-rc1, …) rather
# than every commit. Ordinary pushes and PRs run the cheap test.yml
# workflow instead.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Build every platform on its own runner. macOS needs CGO + the Cocoa
  # SDK, which cross-compiling from Linux cannot provide, so each OS
  # builds natively. Each job uploads its binaries as a job artifact;
  # the release job below collects them all.
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: windows
            goarch: amd64
            runner: windows-latest
          # macos-latest is Apple Silicon. The Intel macOS runner
          # (macos-13) is deprecated and effectively unavailable on
          # GitHub Actions, so only the arm64 build is produced; Intel
          # Macs can run it through Rosetta 2.
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Gio's Linux backend compiles against X11/Wayland/Vulkan via
      # pkg-config; the stock Ubuntu runner has none of those dev headers.
      - name: Install graphics dev headers
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxfixes-dev libwayland-dev libvulkan-dev \
            libegl1-mesa-dev libgles2-mesa-dev

      - name: Build binaries
        shell: bash
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X main.appVersion=${version}"
          suffix=""
          # -H=windowsgui: no console window next to the GUI when the
          # exe is double-clicked.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            suffix=".exe"
            ldflags="$ldflags -H=windowsgui"
          fi

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "$ldflags" \
            -o "dist/ssh-tunnel-manager-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}" .
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "$ldflags" \
            -o "dist/querydns-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}" ./cmd/querydns

      # Package the Linux binaries as a .deb so Ubuntu/Debian users can
      # `sudo apt install ./ssh-tunnel-manager_...deb` — binary, menu
      # entry and icon installed and removed through the package
      # manager. dpkg-deb runs on the native runner, so amd64 and arm64
      # each get a matching package.
      - name: Build .deb package
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          arch="${{ matrix.goarch }}"
          version="${GITHUB_REF_NAME#v}"
          stage=deb-pkg
          mkdir -p "$stage/DEBIAN" \
                   "$stage/usr/bin" \
                   "$stage/usr/share/applications" \
                   "$stage/usr/share/icons/hicolor/128x128/apps"
          sed -e "s/__VERSION__/$version/" -e "s/__ARCH__/$arch/" \
              packaging/debian-control.in > "$stage/DEBIAN/control"
          install -Dm755 "dist/ssh-tunnel-manager-${{ matrix.goos }}-${arch}" "$stage/usr/bin/ssh-tunnel-manager"
          install -Dm755 "dist/querydns-${{ matrix.goos }}-${arch}" "$stage/usr/bin/querydns"
          install -Dm644 packaging/ssh-tunnel-manager.desktop "$stage/usr/share/applications/ssh-tunnel-manager.desktop"
          install -Dm644 packaging/icon.png "$stage/usr/share/icons/hicolor/128x128/apps/ssh-tunnel-manager.png"
          dpkg-deb --root-owner-group --build "$stage" \
            "dist/ssh-tunnel-manager_${version}_${arch}.deb"

      # Upload this platform's binaries so the release job can collect
      # them all into one GitHub Release.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  # Wait for every platform, then publish one release holding all the
  # binaries. Doing this in a separate job avoids every platform racing
  # to create (and then edit) the same release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten binaries into one directory
        shell: bash
        run: |
          mkdir -p release
          find dist -type f -name 'ssh-tunnel-manager-*' -exec cp {} release/ \;
          find dist -type f -name 'querydns-*' -exec cp {} release/ \;
          find dist -type f -name '*.deb' -exec cp {} release/ \;
          ls -l release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*