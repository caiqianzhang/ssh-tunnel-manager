name: release

# Building releases is expensive and only meaningful for a published
# version, so it is gated on a tag push (v1.2.3, v1.2.3-rc1, …) rather
# than every commit. Ordinary pushes and PRs run the cheap test.yml
# workflow instead.
on:
  push:
    tags: ['v*']

jobs:
  build:
    # Each platform builds on its own runner: macOS needs CGO + the
    # Cocoa SDK, which cross-compiling from Linux cannot provide.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
          - goos: windows
            goarch: amd64
            runner: windows-latest
          # macos-latest is Apple Silicon; darwin/amd64 needs the Intel
          # runner so CGO can find the x86_64 Cocoa SDK.
          - goos: darwin
            goarch: amd64
            runner: macos-13
          - goos: darwin
            goarch: arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Gio's Linux backend compiles against X11/Wayland/Vulkan via
      # pkg-config; the stock Ubuntu runner has none of those dev headers.
      - name: Install graphics dev headers
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            libx11-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcursor-dev libxfixes-dev libwayland-dev libvulkan-dev \
            libegl1-mesa-dev libgles2-mesa-dev

      - name: Build binaries
        shell: bash
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME#v}"
          ldflags="-s -w -X main.appVersion=${version}"
          suffix=""
          if [ "${{ matrix.goos }}" = "windows" ]; then suffix=".exe"; fi

          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "$ldflags" \
            -o "dist/ssh-tunnel-manager-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}" .
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags "$ldflags" \
            -o "dist/querydns-${{ matrix.goos }}-${{ matrix.goarch }}${suffix}" ./cmd/querydns

      # Only one job creates the release; otherwise every platform would
      # race to create (and then edit) the same release.
      - name: Create GitHub Release
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*